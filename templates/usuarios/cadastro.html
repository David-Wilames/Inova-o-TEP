{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Inova-TEP</title>

    <link rel="stylesheet" href="{% static 'usuarios/css/cadastro.css' %}">
</head>

<body>

    <div class="cadastro-container">

        <div class="cadastro-card">

            <h1>Criar conta</h1>

            <p class="subtitulo">
                Cadastre-se para acessar o Inova-TEP
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Escolha um usuário"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="confirmar_senha">Confirmar senha</label>
                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Digite a senha novamente"
                        required
                    >
                </div>

                <button type="submit">
                    Criar conta
                </button>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="/usuario/login/colaborador/">
                    Fazer login
                </a>
            </p>

        </div>

    </div>

</body>
</html>
