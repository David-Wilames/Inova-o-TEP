<div class="perfil-colaborador-container">

    <!-- PERFIL -->
    <button class="perfil-colaborador-card" type="button" onclick="abrirMenuColaborador()">
        <div class="perfil-colaborador-icone">
            <span>👤</span>
        </div>

        <div class="perfil-colaborador-info">
            <span class="perfil-colaborador-label">
                ACESSAR COMO
            </span>

            <strong>Colaborador</strong>
        </div>

        <div class="perfil-colaborador-seta">
            →
        </div>
    </button>


    <!-- MENU DO COLABORADOR -->
    <div class="menu-colaborador" id="menu-colaborador">

        <button type="button" class="menu-colaborador-item">
            <span class="menu-colaborador-icone">👤</span>
            <span>Informações do colaborador</span>
        </button>

        <button type="button" class="menu-colaborador-item" onclick="adicionarInformacoesColaborador()">
            <span class="menu-colaborador-icone">➕</span>
            <span>Adicionar informações</span>
            
        </button>


        <button type="button" class="menu-colaborador-item">
            <span class="menu-colaborador-icone">⭐</span>
            <span>Avaliações</span>
        </button>

        <button type="button" class="menu-colaborador-item menu-colaborador-sair" onclick="sairColaborador()">
            <span class="menu-colaborador-icone">🚪</span>
            <span>Sair</span>
        </button>

    </div>

</div>
<script>
    function abrirMenuColaborador() {
        const menu = document.getElementById("menu-colaborador");

        if (!menu) {
            return;
        }

        menu.classList.toggle("mostrar");
    }

    function adicionarInformacoesColaborador() {
        window.location.href = "{% url 'adicionar_informacoes' %}";
    }

    function sairColaborador() {
        window.location.href = "/usuario/login/colaborador/";
    }
</script>
