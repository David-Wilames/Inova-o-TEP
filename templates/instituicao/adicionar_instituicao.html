{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adicionar Instituição | Inovação TEP</title>

    <link rel="stylesheet" href="{% static 'usuarios/css/instituicao/adicionar_instituicao.css' %}">

</head>

<body>

    <main class="pagina-cadastro">

        <section class="cadastro-card">

            <div class="cadastro-header">

                <div class="cadastro-icone">
                    🏫
                </div>

                <div>

                    <span class="cadastro-label">
                        INOVAÇÃO TEP
                    </span>

                    <h1>
                        Adicionar instituição
                    </h1>

                    <p>
                        Cadastre as informações da escola e da aula.
                    </p>

                </div>

            </div>


            <form method="post">

                {% csrf_token %}


                <!-- DADOS DA ESCOLA -->

                <div class="secao-formulario">

                    <h2>🏫 Dados da escola</h2>


                    <!-- SELEÇÃO DA ESCOLA -->

                    <div class="campo">

                        <label for="escola">
                            Selecione a escola
                        </label>

                        <select id="escola" name="escola" required>

                            <option value="">
                                Selecione uma escola
                            </option>

                            {% for escola in escolas %}

                            <option value="{{ escola.id }}" data-nome="{{ escola.nome_unidade_escolar }}"
                                data-telefone="{{ escola.telefone }}" data-endereco="{{ escola.endereco }}"
                                data-municipio="{{ escola.municipio }}" data-bairro="{{ escola.bairro_localidade }}"
                                data-cep="{{ escola.cep }}">
                                {{ escola.nome_unidade_escolar }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>



                    <!-- TELEFONE E NÚMERO -->

                    <div class="linha">

                        <div class="campo">

                            <label for="telefone">
                                Telefone
                            </label>

                            <input type="text" id="telefone" name="telefone" placeholder="Telefone" readonly>

                        </div>


                        <div class="campo">

                            <label for="numero_escola">
                                CEP
                            </label>

                            <input type="text" id="numero_escola" name="numero_escola" placeholder="CEP" readonly>

                        </div>

                    </div>


                    <!-- ENDEREÇO -->

                    <div class="campo">

                        <label for="endereco">
                            Endereço
                        </label>

                        <input type="text" id="endereco" name="endereco" placeholder="Endereço da escola" readonly>

                    </div>


                    <!-- MUNICÍPIO E BAIRRO -->

                    <div class="linha">

                        <div class="campo">

                            <label for="municipio">
                                Município
                            </label>

                            <input type="text" id="municipio" name="municipio" placeholder="Município" readonly>

                        </div>


                        <div class="campo">

                            <label for="bairro">
                                Bairro
                            </label>

                            <input type="text" id="bairro" name="bairro" placeholder="Bairro" readonly>

                        </div>

                    </div>

                </div>


                <!-- DADOS DA AULA -->

                <div class="secao-formulario">

                    <h2>📚 Dados da aula</h2>


                    <div class="campo">

                        <label for="materia">
                            Matéria
                        </label>

                        <input type="text" id="materia" name="materia" placeholder="Ex.: Matemática" required>

                    </div>


                    <div class="linha">

                        <div class="campo">

                            <label for="tipo_aula">
                                Tipo
                            </label>

                            <select id="tipo_aula" name="tipo_aula" required>

                                <option value="">
                                    Selecione
                                </option>

                                <option value="aula">
                                    Aula
                                </option>

                                <option value="horas">
                                    Horas
                                </option>

                            </select>

                        </div>


                        <div class="campo">

                            <label for="quantidade">
                                Quantidade
                            </label>

                            <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex.: 2"
                                required>

                        </div>

                    </div>

                </div>


                <!-- RESPONSÁVEL -->

                <div class="secao-formulario">

                    <h2>👤 Responsável pela solicitação</h2>


                    <div class="campo">

                        <label for="responsavel">
                            Nome do responsável
                        </label>

                        <input type="text" id="responsavel" name="responsavel" placeholder="Nome completo" required>

                    </div>

                </div>


                <!-- OBSERVAÇÕES -->

                <div class="secao-formulario">

                    <h2>📝 Observações</h2>


                    <div class="campo">

                        <label for="observacoes">
                            Observações
                        </label>

                        <textarea id="observacoes" name="observacoes" rows="4"
                            placeholder="Digite alguma observação sobre a instituição..."></textarea>

                    </div>

                </div>


                <!-- BOTÕES -->

                <div class="acoes">

                    <button type="button" class="botao-voltar" onclick="history.back()">
                        ← Voltar
                    </button>


                    <button type="submit" class="botao-cadastrar">
                        Adicionar instituição
                    </button>

                </div>

            </form>

        </section>

    </main>

   
    <script>
        const escolaSelect = document.getElementById("escola");

        const telefone = document.getElementById("telefone");
        const endereco = document.getElementById("endereco");
        const municipio = document.getElementById("municipio");
        const bairro = document.getElementById("bairro");
        const cep = document.getElementById("numero_escola");

        escolaSelect.addEventListener("change", function () {

            const opcaoSelecionada = this.options[this.selectedIndex];

            if (!opcaoSelecionada.value) {
                telefone.value = "";
                endereco.value = "";
                municipio.value = "";
                bairro.value = "";
                cep.value = "";
                return;
            }

            telefone.value = opcaoSelecionada.dataset.telefone || "";
            endereco.value = opcaoSelecionada.dataset.endereco || "";
            municipio.value = opcaoSelecionada.dataset.municipio || "";
            bairro.value = opcaoSelecionada.dataset.bairro || "";
            cep.value = opcaoSelecionada.dataset.cep || "";
        });
    </script>
  


</body>

</html>
